# The module table (docs/synth.md "The module table").
#
# Every value in a patch is one parameter of a module, a modulation source,
# a channel effect or a route, stored normalized 0..1 and described by a
# descriptor. The descriptors are the 96 of params.toml (the Klont
# vocabulary, kept for Influence matching and for today's presets) plus the
# [[desc]] entries below. Append descriptors, never reorder or reuse an id:
# the engine receives each value's descriptor by index.
#
# A [[module]] lists its parameters in value order as "name:descriptor" or
# "name:descriptor*N" for N consecutive values (a 16-band shape). A patch may
# give one of its values another descriptor of the same kind (the classic
# patch keeps the old ranges of lfo2.rate, chaos.rate and the envelope times
# that way); the descriptor named here is the default.
#
# kind: voice (runs per voice), source (per-voice modulation source), layer
# (a layer source, per voice patch) or channel (per layer).
# code: the type number in the patch blob (crates/klont/src/patch.rs).
# steps: a stepped value takes that many evenly spaced real values; a morph
# switches it at its midpoint.
# scalable: a gain, level or mix, the only values a `scale` route may multiply.
# cost: what one instance costs per sample, in nanoseconds of CPU time on the
# build machine (`cargo run -p klont --release --bin bench -- --costs`
# measures them; these are the measured figures rounded up, Nov 21, 2026). For a voice module it
# is paid per sounding voice; for a layer source or a channel effect once per
# layer. [cost] holds the same for routes. The engine and the app both work a
# layer's voice count out of these (docs/synth.md "Rules for the graph").
# [vocab] scalable lists the vocabulary descriptors a `scale` route may multiply.
# `pnpm gen:params` turns this file into crates/params/src/modules.rs and
# web/src/gen/modules.ts.

[cost]
# One voice route evaluated every tick, per voice.
route   = 0.25
# Once per voice patch when any route moves a partial-bank value that makes
# the bank rebuild its tables every tick (its spectrum, ratios or ring).
rebuild = 11.0
# A layer may spend what this many classic voices cost.
voices  = 8

[vocab]
scalable = ["src.harm_mix", "src.noise_mix", "src.grain_mix", "delay.mix", "verb.mix"]

[[desc]]
id        = "amp.gain"
group     = "tone"
scale     = "lin"
min       = 0.0
max       = 2.0
neutral   = 1.0
unit      = ""
smooth_ms = 15
scalable  = 1
doc       = "Gain of an amp module. 1 leaves the level as it is."

[[desc]]
id        = "env.mode"
group     = "shape"
scale     = "lin"
min       = 0.0
max       = 2.0
neutral   = 0.0
unit      = ""
smooth_ms = 0
steps     = 3
doc       = "0 ADSR: note-off starts the release. 1 decay: starts at full, falls with decay, and note-off adds the release. 2 one-shot: starts at full, falls with decay, ignores note-off."

[[desc]]
id        = "lfo.wave"
group     = "motion"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 0.0
unit      = ""
smooth_ms = 15
steps     = 6
doc       = "Wave of an LFO, in steps of 0.2: sine, triangle, saw, square, random steps, drift (smoothed random). 0 and 1 are the two waves of the old fixed LFOs."

[[desc]]
id        = "lfo.level"
group     = "motion"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 1.0
unit      = ""
smooth_ms = 15
doc       = "Output level of an LFO."

[[desc]]
id        = "route.amount"
group     = "motion"
scale     = "bipolar"
min       = -1.0
max       = 1.0
neutral   = 0.0
unit      = ""
smooth_ms = 15
doc       = "Amount of a modulation route. 1 moves the target across its whole range; for pitch, 1 is 48 semitones."

[[desc]]
id        = "voicing.depth"
group     = "tone"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 1.0
unit      = ""
smooth_ms = 15
doc       = "How far unvoiced sung frames swap the pitched sources for noise."

[[desc]]
id        = "partials.octave"
group     = "tone"
scale     = "lin"
min       = -3.0
max       = 3.0
neutral   = 0.0
unit      = "oct"
smooth_ms = 0
steps     = 7
doc       = "Octave of the partial bank against the voice pitch."

[[desc]]
id        = "partials.fine"
group     = "tone"
scale     = "bipolar"
min       = -100.0
max       = 100.0
neutral   = 0.0
unit      = "cents"
smooth_ms = 15
doc       = "Fine tune of the partial bank against the voice pitch."

[[desc]]
id        = "osc.level"
group     = "tone"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 0.5
unit      = ""
smooth_ms = 15
scalable  = 1
doc       = "Level of an oscillator."

[[desc]]
id        = "osc.wave"
group     = "tone"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 0.6666667
unit      = ""
smooth_ms = 15
doc       = "Wave of an oscillator, a morph: sine at 0, triangle at 1/3, saw at 2/3, square (pulse) at 1."

[[desc]]
id        = "osc.pw"
group     = "tone"
scale     = "lin"
min       = 0.05
max       = 0.95
neutral   = 0.5
unit      = ""
smooth_ms = 15
doc       = "Pulse width of the square wave: the part of each cycle spent high."

[[desc]]
id        = "pitch.octave"
group     = "tone"
scale     = "lin"
min       = -3.0
max       = 3.0
neutral   = 0.0
unit      = "oct"
smooth_ms = 0
steps     = 7
doc       = "Octave of a pitched module against the voice pitch."

[[desc]]
id        = "pitch.semi"
group     = "tone"
scale     = "lin"
min       = -12.0
max       = 12.0
neutral   = 0.0
unit      = "st"
smooth_ms = 0
steps     = 25
doc       = "Semitones of a pitched module against the voice pitch."

[[desc]]
id        = "pitch.fine"
group     = "tone"
scale     = "bipolar"
min       = -100.0
max       = 100.0
neutral   = 0.0
unit      = "cents"
smooth_ms = 15
doc       = "Fine tune of a pitched module against the voice pitch."

[[desc]]
id        = "osc.pm"
group     = "tone"
scale     = "lin"
min       = 0.0
max       = 4.0
neutral   = 0.0
unit      = ""
smooth_ms = 15
doc       = "Phase modulation depth: how many radians a full-scale signal on the pm input moves the phase."

[[desc]]
id        = "noise.level"
group     = "tone"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 0.5
unit      = ""
smooth_ms = 15
scalable  = 1
doc       = "Level of a noise module."

[[desc]]
id        = "noise.colour"
group     = "tone"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 0.0
unit      = ""
smooth_ms = 15
doc       = "Colour of the noise, a morph: white at 0, pink at 0.5, brown at 1."

[[desc]]
id        = "sampler.level"
group     = "tone"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 0.5
unit      = ""
smooth_ms = 15
scalable  = 1
doc       = "Level of a sampler."

[[desc]]
id        = "sampler.start"
group     = "shape"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 0.0
unit      = ""
smooth_ms = 0
doc       = "Where a note starts playing the sample, as a part of its length. Read at note start."

[[desc]]
id        = "sampler.loop"
group     = "shape"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 0.0
unit      = ""
smooth_ms = 0
steps     = 2
doc       = "Loop off (0) or on (1)."

[[desc]]
id        = "sampler.loop_start"
group     = "shape"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 0.0
unit      = ""
smooth_ms = 15
doc       = "Start of the loop, as a part of the sample's length."

[[desc]]
id        = "sampler.loop_len"
group     = "shape"
scale     = "log"
min       = 0.001
max       = 1.0
neutral   = 1.0
unit      = ""
smooth_ms = 15
doc       = "Length of the loop, as a part of the sample's length."

[[desc]]
id        = "sampler.follow"
group     = "tone"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 1.0
unit      = ""
smooth_ms = 15
doc       = "How far the playback speed follows the voice pitch. 0 plays the sample at its own speed for every note."

[[desc]]
id        = "input.mix"
group     = "space"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 0.0
unit      = ""
smooth_ms = 20
scalable  = 1
doc       = "Raw input against the synth: 0 is only the synth, 1 only the raw input (the mic, or the take on playback). An equal-power crossfade."

[[desc]]
id        = "input.trim"
group     = "space"
scale     = "lin"
min       = -24.0
max       = 12.0
neutral   = 0.0
unit      = "dB"
smooth_ms = 20
doc       = "Gain on the raw input before the blend."

[[module]]
type   = "partials"
kind   = "voice"
code   = 1
cost   = 18.5
params = ["level:src.harm_mix", "tilt:src.tilt", "oddeven:src.oddeven", "stretch:src.stretch", "jitter:src.jitter", "modal:src.modal", "damp:src.damp", "f1_freq:src.f1_freq", "f1_gain:src.f1_gain", "f2_freq:src.f2_freq", "f2_gain:src.f2_gain", "tone_bands:tone_bands.0*16", "octave:partials.octave", "fine:partials.fine"]

[[module]]
type   = "osc"
kind   = "voice"
code   = 2
cost   = 2.5
params = ["level:osc.level", "wave:osc.wave", "pw:osc.pw", "octave:pitch.octave", "semi:pitch.semi", "fine:pitch.fine", "pm:osc.pm"]

[[module]]
type   = "noise"
kind   = "voice"
code   = 3
cost   = 2.0
params = ["level:noise.level", "colour:noise.colour"]

[[module]]
type   = "sampler"
kind   = "voice"
code   = 4
cost   = 3.5
params = ["level:sampler.level", "start:sampler.start", "loop:sampler.loop", "loop_start:sampler.loop_start", "loop_len:sampler.loop_len", "follow:sampler.follow", "octave:pitch.octave", "fine:pitch.fine"]

[[module]]
type   = "click"
kind   = "voice"
code   = 5
cost   = 0.5
params = ["start:strike.click", "end:strike.end_click", "colour:strike.color"]

[[module]]
type   = "filter"
kind   = "voice"
code   = 6
cost   = 5.0
params = ["cutoff:filt.cutoff", "res:filt.res", "morph:filt.morph", "track:filt.track"]

[[module]]
type   = "amp"
kind   = "voice"
code   = 7
cost   = 2.0
params = ["gain:amp.gain"]

[[module]]
type   = "fold"
kind   = "voice"
code   = 8
cost   = 17.0
params = ["amount:fold.amt", "bias:fold.bias"]

[[module]]
type   = "clang"
kind   = "voice"
code   = 9
cost   = 7.0
params = ["amount:clang.amt", "ratio:clang.ratio"]

[[module]]
type   = "comb"
kind   = "voice"
code   = 10
cost   = 3.5
params = ["amount:comb.amt", "tune:comb.tune", "decay:comb.decay"]

[[module]]
type   = "env"
kind   = "source"
code   = 30
cost   = 0.1
params = ["mode:env.mode", "attack:env.attack", "hold:env.hold", "decay:env.decay", "sustain:env.sustain", "release:env.release"]

[[module]]
type   = "lfo"
kind   = "source"
code   = 31
cost   = 0.1
params = ["rate:lfo1.rate", "wave:lfo.wave", "level:lfo.level"]

[[module]]
type   = "shaped_noise"
kind   = "layer"
code   = 40
cost   = 18.5
params = ["level:src.noise_mix", "bands:noise_bands.0*16"]

[[module]]
type   = "grains"
kind   = "layer"
code   = 41
cost   = 45.0
params = ["level:src.grain_mix", "size:grain.size", "density:grain.density", "pos:grain.pos", "spray:grain.spray", "scatter:grain.scatter"]

[[module]]
type   = "crush"
kind   = "channel"
code   = 21
cost   = 0.5
params = ["bits:crush.bits", "rate:crush.rate"]

[[module]]
type   = "tape"
kind   = "channel"
code   = 22
cost   = 10.5
params = ["amount:tape.amt"]

[[module]]
type   = "delay"
kind   = "channel"
code   = 23
cost   = 10.0
params = ["time:delay.time", "feedback:delay.fb", "shift:delay.shift", "mix:delay.mix"]

[[module]]
type   = "reverb"
kind   = "channel"
code   = 24
cost   = 29.5
params = ["size:verb.size", "damp:verb.damp", "mix:verb.mix", "freeze:verb.freeze"]

[[module]]
type   = "cfilter"
kind   = "channel"
code   = 25
cost   = 5.5
params = ["cutoff:filt.cutoff", "res:filt.res", "morph:filt.morph"]

[[module]]
type   = "input"
kind   = "channel"
code   = 26
cost   = 1.0
params = ["mix:input.mix", "trim:input.trim"]
