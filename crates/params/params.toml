# Band shapes: 16 gains in dB at the band centres the capture front end
# measures (80 Hz to 12 kHz, log spaced). `count` expands to ids tone_bands.0
# through tone_bands.15.
[[bands]]
id        = "tone_bands"
group     = "tone"
scale     = "db"
min       = -30.0
max       = 30.0
neutral   = 0.0
unit      = "dB"
smooth_ms = 15
count     = 16
doc       = "Partial levels by frequency band, the vowel shape."

[[bands]]
id        = "noise_bands"
group     = "tone"
scale     = "db"
min       = -30.0
max       = 30.0
neutral   = 0.0
unit      = "dB"
smooth_ms = 15
count     = 16
doc       = "Noise levels by frequency band."
