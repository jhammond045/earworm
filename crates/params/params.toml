# The Earworm parameter table (TDD "Parameter system").
#
# Every sound is these 64 scalars plus the two 16-band shapes at the end: 96
# numbers, each stored normalized 0..1. Order is the wire order and the index
# into a ParamSet; append new parameters, never reorder, never reuse an id.
# `pnpm gen:params` turns this file into crates/params/src/table.rs,
# web/src/gen/params.ts, web/src/gen/params.schema.json and
# web/src/gen/params-dictionary.md.
#
# scale: lin | log | db | bipolar. log maps n to min * (max/min)^n; the others
# map linearly (bipolar is centred in the interface, db is shown in dB).
# macros: weights into the eight-macro matrix, named in [macros] below.

[macros]
names = ["bright", "body", "wobble", "grit", "space", "punch", "air", "length"]

[[param]]
id        = "src.harm_mix"
group     = "tone"
scale     = "lin"
min       = 0.0
max       = 1.0
neutral   = 1.0
unit      = ""
smooth_ms = 15
doc       = "Level of the partial bank."

[[param]]
