<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earworm M0: Live test session</title>
<link rel="stylesheet" href="/src/common/style.css">
<style>
  body { padding: 0; }
  .split { display: grid; grid-template-columns: minmax(300px, 2fr) 3fr; height: 100vh; }
  .split iframe { width: 100%; height: 100%; border: 0; display: block; }
  .split iframe + iframe { border-left: 1px solid var(--line); }
  /* Narrow screens: stack, each pane a full screen tall. */
  @media (max-width: 760px) {
    .split { grid-template-columns: 1fr; height: auto; }
    .split iframe { height: 100vh; }
    .split iframe + iframe { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="split">
  <iframe id="test" title="Live follow listening test checklist" allow="microphone"></iframe>
  <iframe id="live" title="Live follow" allow="microphone"></iframe>
</div>
<script>
  // Both panes are the normal pages; ?embed=1 hides their links to each
  // other. Any other query (for example ?fallback=1) is passed through.
  const q = new URLSearchParams(location.search);
  q.set('embed', '1');
  document.getElementById('test').src = 'live-test.html?' + q;
  document.getElementById('live').src = 'live.html?' + q;
</script>
</body>
</html>
